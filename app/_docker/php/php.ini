; ============================================================
;  Hardening de seguridad — Atiende (php:7.3-fpm)
;  Se monta en /usr/local/etc/php/conf.d/ (ver docker-compose.yml).
;  Aplicar con: docker compose up -d app   (recrea el contenedor)
; ============================================================

; No filtrar errores/stack traces ni SQL al usuario final (sí loguear en server).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; --- Cookies de sesión ---
; HttpOnly: el JS no puede leer la cookie → mitiga robo de sesión por XSS.
session.cookie_httponly = 1
; SameSite=Lax: corta CSRF cross-site sin romper la navegación normal/login.
session.cookie_samesite = "Lax"
; Strict mode: ignora IDs de sesión no generados por el server (anti session fixation).
session.use_strict_mode = 1
; Secure: activar SOLO cuando el sitio corre 100% bajo HTTPS (en dev http rompería el login).
; Descomentar en producción:
; session.cookie_secure = 1

; --- Subida de archivos (importación masiva de imágenes de artículos) ---
; Cada imagen tope 2MB (validado en server); 3M deja margen. Los lotes agrupan hasta
; ~40MB / 20 archivos por request → post_max_size 64M y hasta 40 archivos por POST.
upload_max_filesize = 3M
post_max_size = 64M
max_file_uploads = 40
